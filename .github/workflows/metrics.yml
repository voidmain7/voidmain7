name: Metrics
on:
  # Actualización diaria programada
  schedule: [{cron: "0 0 * * *"}]
  # (opcional) Ejecutar el workflow manualmente
  workflow_dispatch:
  # (opcional) Ejecutar el workflow al hacer push en master/main
  push: {branches: ["master", "main"]}
jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}

          # --- Plugin: gráfico de líneas con actividad de commits ---
          plugin_lines: yes
          plugin_lines_sections: base

          # --- Plugin: lenguajes de programación más usados ---
          plugin_languages: yes
          plugin_languages_analysis_timeout: 15
          plugin_languages_categories: markup, programming
          plugin_languages_limit: 8

          # --- Plugin: repos destacados / pinned ---
          plugin_pagespeed: no

          # --- Plugin: gráfico de calendario tipo "heatmap" de contribuciones ---
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

          # --- Plugin: racha de commits (streak) ---
          # Desactivado: bug sin arreglar en lowlighter/metrics que rompe
          # esta sección cuando un push event trae un commit undefined
          # (https://github.com/lowlighter/metrics/issues/1739)
          plugin_habits: no

          # --- Plugin: estrellas recibidas en tus repos ---
          plugin_stars: yes
          plugin_stars_limit: 4

          # --- Plugin: introducción con avatar y estado ---
          plugin_introduction: yes
