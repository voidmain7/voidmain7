name: Metrics
on:
  # Actualización diaria programada
  schedule: [{cron: "0 0 * * *"}]
  # (opcional) Ejecutar el workflow manualmente
  workflow_dispatch:
  # (opcional) Ejecutar el workflow al hacer push en master/main
  push: {branches: ["master", "main"]}
jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
 
